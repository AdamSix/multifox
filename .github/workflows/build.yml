name: Build desktop apps

# Push a tag (e.g. v0.2.0) to build all three platforms and attach the zips
# to a GitHub Release for that tag. workflow_dispatch builds artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-14 # Apple Silicon (arm64)
            asset: multifox-macos-arm64.zip
          - runs-on: macos-15-intel # Intel (x86_64); macos-13 retired Dec 2025
            asset: multifox-macos-x86_64.zip
    runs-on: ${{ matrix.runs-on }}
    env:
      # camoufox fetch hits the GitHub releases API; authenticate to avoid
      # the flaky unauthenticated rate limit on shared runner IPs
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # promoted to job-level env so `if:` conditions below can read them —
      # the `secrets` context isn't allowed directly in `if:` on a
      # non-reusable workflow
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install camoufox package + browser
        run: python3 install.py
      - name: Fetch GeoIP database
        run: .venv/bin/python -c "from camoufox.geolocation import download_mmdb; download_mmdb()"
      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/multifox-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/multifox-cert.p12"
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
      - name: Decode notarization API key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Build app
        env:
          MULTIFOX_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./packaging/build_app.sh
      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/multifox-signing.keychain-db" 2>/dev/null || true
      - name: Rename artifact
        run: mv dist/multifox.zip "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install camoufox package + browser
        run: python install.py
      - name: Fetch GeoIP database
        run: .venv\Scripts\python.exe -c "from camoufox.geolocation import download_mmdb; download_mmdb()"
      - name: Build app
        run: .\packaging\build_app.ps1
      - name: Rename artifact
        run: Move-Item dist\multifox.zip dist\multifox-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: multifox-windows-x86_64.zip
          path: dist/multifox-windows-x86_64.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
