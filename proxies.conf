# One SOCKS5 proxy per line, in profile order (id1..id10), as host:port.
# Each line must be a DIFFERENT egress — same IP on two lines links those identities.
#
# IMPORTANT: the proxies must be UP when you create identities (Start/Create
# in the dashboard) — creation sends a GeoIP lookup through each one so every
# identity's timezone, locale and geolocation match its exit IP.
#
# Easy way to get 10 local SOCKS5 endpoints: 10 ssh tunnels to your VPSes, e.g.
#   ssh -N -D 127.0.0.1:1081 user@vps1
#   ssh -N -D 127.0.0.1:1082 user@vps2
# then list 127.0.0.1:1081 ... below.
#
# "DIRECT" means no proxy for that profile (your real IP — almost never what
# you want; also skips the GeoIP matching, so timezone won't line up).
# If a proxy requires username/password auth, Firefox will prompt on first request.
#
# Example:
# 127.0.0.1:1081
# 127.0.0.1:1082
# 127.0.0.1:1083
# 127.0.0.1:1084
# 127.0.0.1:1085
# 127.0.0.1:1086
# 127.0.0.1:1087
# 127.0.0.1:1088
# 127.0.0.1:1089
# 127.0.0.1:1090
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
