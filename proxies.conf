# One proxy per line. Each line must be a DIFFERENT egress — the same IP on
# two lines links those identities.
#
# Accepted forms:
#   host:port                 anonymous
#   host:port:user:pass       authenticated — what most residential providers hand out
#   user:pass@host:port       the same thing, URL style
#   DIRECT                    no proxy for that identity (your real IP)
#
# Any line may be prefixed with a scheme: http://, https://, socks5://,
# socks4://. Without one, multifox probes the endpoint and uses whichever of
# HTTP and SOCKS5 it answers, then says which in the log. A password may
# contain ':' or '@'.
#
# Credentials are always sent over HTTP, never SOCKS: Playwright refuses to
# authenticate to a SOCKS proxy. A provider that only offers authenticated
# SOCKS5 cannot be used — ask for an HTTP endpoint or an IP-whitelisted one.
#
# A line that cannot be parsed stops Start before any profile is written, and
# names the line.
#
# Lines are handed out least-used-first, not by position, so identities have
# no fixed slot.
#
# IMPORTANT: the proxies must be UP when you create identities (Start/Create
# in the dashboard) — creation sends a GeoIP lookup through each one so every
# identity's timezone, locale and geolocation match its exit IP.
#
# "DIRECT" is almost never what you want: it uses your real IP and skips the
# GeoIP matching, so the timezone won't line up.
#
# Easy way to get local SOCKS5 endpoints: ssh tunnels to your VPSes, e.g.
#   ssh -N -D 127.0.0.1:1081 user@vps1
#   ssh -N -D 127.0.0.1:1082 user@vps2
# then list 127.0.0.1:1081 ... below.
#
# Example:
# 127.0.0.1:1081
# 127.0.0.1:1082
# proxy.example.com:8080:myuser:mypass
# socks5://127.0.0.1:1083
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
DIRECT
