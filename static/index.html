<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ff-sessions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0d1117; color: #c9d1d9;
    font: 14px/1.5 -apple-system, "SF Mono", Menlo, monospace;
  }
  h1 { font-size: 18px; margin: 0 0 16px; color: #f0f6fc; }
  h1 span { color: #8b949e; font-weight: normal; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  }
  input {
    background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  #count { width: 70px; }
  #url { width: 320px; }
  button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer;
  }
  button:hover { background: #30363d; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.danger { color: #f85149; }
  #job {
    margin: 16px 0; padding: 12px; background: #161b22;
    border: 1px solid #30363d; border-radius: 8px; white-space: pre-wrap;
    font-size: 13px; height: 84px; overflow-y: auto; display: none;
  }
  #job .running { color: #d29922; }
  #job .done { color: #3fb950; }
  #job .error { color: #f85149; }
  #grid {
    display: grid; gap: 12px; margin-top: 8px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .tile {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tile header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; font-size: 13px;
  }
  .tile header .id { color: #f0f6fc; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.running { background: #3fb950; }
  .dot.exited { background: #8b949e; }
  .dot.untracked { background: #d29922; }
  .shot {
    width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;
    background: #0d1117; border-top: 1px solid #21262d; border-bottom: 1px solid #21262d;
  }
  .noshot {
    width: 100%; aspect-ratio: 16 / 10; display: flex; align-items: center;
    justify-content: center; color: #6e7681; font-size: 12px; text-align: center;
    background: #0d1117; border-top: 1px solid #21262d; border-bottom: 1px solid #21262d;
    padding: 8px;
  }
  .tile footer {
    padding: 6px 10px; font-size: 12px; color: #8b949e;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty { color: #8b949e; padding: 24px 0; text-align: center; }
  body > footer { margin-top: 24px; color: #6e7681; font-size: 12px; }
</style>
</head>
<body>
<h1>ff-sessions <span>— isolated Camoufox identities</span></h1>

<div class="controls">
  <label>count <input id="count" type="number" min="1" max="100" value="10"></label>
  <label>url <input id="url" type="text" value="https://browserleaks.com/ip"></label>
  <label title="off = every identity uses your real IP"><input id="proxytoggle" type="checkbox" checked> proxies</label>
  <button id="create">Create</button>
  <button id="launch">Launch</button>
  <button id="stop" class="danger">Stop &amp; wipe</button>
  <button id="update">Update camoufox</button>
  <span id="proxies"></span>
  <span id="stale"></span>
</div>

<div id="job"></div>

<div id="grid"></div>
<div id="empty" class="empty">no profiles — Create a set to begin</div>

<footer>
  Launch attaches the Playwright controller: windows close when the dashboard
  exits. Identities launched via ffid.sh show as “untracked” (no live view).
  Stop kills everything and deletes all profiles.
</footer>

<script>
const $ = (id) => document.getElementById(id);
let lastSig = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) alert(data.error || res.statusText);
  refresh();
}

$("create").onclick = () => api("/api/create", {count: +$("count").value});
$("launch").onclick = () => api("/api/launch", {url: $("url").value});
$("stop").onclick = () => {
  if (confirm("Kill all identity instances and DELETE the profiles?")) api("/api/stop");
};
$("update").onclick = () => api("/api/update");
$("proxytoggle").onchange = () => api("/api/proxies", {enabled: $("proxytoggle").checked});

function esc(s) { return String(s ?? "?").replace(/</g, "&lt;"); }

function render(state) {
  $("proxytoggle").checked = !!state.proxies_enabled;
  $("proxies").textContent = state.proxies_enabled
    ? `${state.proxy_entries} proxies configured (${state.direct_entries} DIRECT)`
    : "proxies off — everything uses your real IP";
  $("proxies").style.color = state.proxies_enabled ? "" : "#d29922";

  const f = state.freshness || {};
  const stale = [];
  if (f.browser_latest && f.browser_installed && f.browser_installed !== f.browser_latest)
    stale.push(`browser ${f.browser_installed} → ${f.browser_latest}`);
  if (f.package_latest && f.package_installed && f.package_installed !== f.package_latest)
    stale.push(`camoufox pkg ${f.package_installed} → ${f.package_latest}`);
  $("stale").textContent = stale.length ? `update available: ${stale.join(", ")}` : "";
  $("stale").style.color = "#d29922";
  $("update").textContent = stale.length ? "Update camoufox!" : "Update camoufox";
  $("update").style.color = stale.length ? "#d29922" : "";

  const job = [...(state.jobs || [])].reverse().find(j => j.status === "running") ||
              (state.jobs || [])[state.jobs.length - 1];
  const jobEl = $("job");
  if (job) {
    jobEl.style.display = "block";
    jobEl.innerHTML =
      `<span class="${job.status}">● ${job.kind} — ${job.status}</span>\n` +
      job.log.map(esc).join("\n");
    jobEl.scrollTop = jobEl.scrollHeight;
  } else {
    jobEl.style.display = "none";
  }

  const busy = (state.jobs || []).some(j => j.status === "running");
  $("create").disabled = busy;
  $("launch").disabled = busy;
  $("stop").disabled = busy;
  $("update").disabled = busy;

  // rebuild the grid only when the identity set or run-states change
  const sig = JSON.stringify(state.identities.map(i =>
    [i.id, i.controlled, i.running, i.proxy, i.os, i.tz, i.ua_tail]));
  if (sig !== lastSig) {
    lastSig = sig;
    $("grid").innerHTML = state.identities.map(i => {
      let cls, label;
      if (i.controlled)        { cls = "running";   label = "controlled"; }
      else if (i.running)      { cls = "running";   label = "running"; }
      else if (i.tracked)      { cls = "exited";    label = "exited"; }
      else                     { cls = "untracked"; label = "untracked"; }
      const view = i.controlled
        ? `<img class="shot" data-shot="${esc(i.id)}" alt="">`
        : `<div class="noshot">no live view<br>(${label})</div>`;
      return `<div class="tile">
        <header><span class="id">${esc(i.id)}</span>
          <span><span class="dot ${cls}"></span> ${label}</span></header>
        ${view}
        <footer>${esc(i.proxy)} · ${esc(i.os)} · ${esc(i.tz)}<br>…${esc(i.ua_tail)}</footer>
      </div>`;
    }).join("");
    $("empty").style.display = state.identities.length ? "none" : "block";
    refreshShots();
  }
}

function refreshShots() {
  const t = Date.now();
  document.querySelectorAll("img.shot").forEach(img => {
    img.src = `/api/shot/${img.dataset.shot}?t=${t}`;
  });
}

async function refresh() {
  try {
    const res = await fetch("/api/state");
    render(await res.json());
  } catch (e) { /* server restarting */ }
}

refresh();
setInterval(refresh, 2000);
setInterval(refreshShots, 3000);
</script>
</body>
</html>
